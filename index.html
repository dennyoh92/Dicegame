    // Main Game Component
    function Game() {
      const [playerId, setPlayerId] = useState("");
      const [playerIdInput, setPlayerIdInput] = useState("");
      const [gameStarted, setGameStarted] = useState(false);
      
      const [playerState, setPlayerState] = useState(getInitialPlayerState);
      const [currentDice, setCurrentDice] = useState(() => {
        const initialDiceCount = getInitialPlayerState().diceTypes.length;
        return Array.from({ length: initialDiceCount }, (_, i) => i + 1);
      });
      const [diceFaceIndices, setDiceFaceIndices] = useState(() => {
        const n = getInitialPlayerState().diceTypes.length;
        return Array.from({ length: n }, (_, i) => i);
      });
      const [selectedIndices, setSelectedIndices] = useState(new Set());
      const [rerollsLeft, setRerollsLeft] = useState(2);
      const [roundStarted, setRoundStarted] = useState(false);
      
      const currentStage = STAGES[playerState.currentStage - 1];
      const [monsterHp, setMonsterHp] = useState(currentStage.hp);
      const [lastDamage, setLastDamage] = useState(0);
      const [showDamage, setShowDamage] = useState(false);
      const [attackResult, setAttackResult] = useState(null);
      const [showAttackResult, setShowAttackResult] = useState(false);
      
      const [stunnedIndices, setStunnedIndices] = useState(new Set());
      const [beingStunnedIndex, setBeingStunnedIndex] = useState(null);
      const [showCounterattack, setShowCounterattack] = useState(false);
      const [isMonsterAttacking, setIsMonsterAttacking] = useState(false);
      const [isPlayerAttacking, setIsPlayerAttacking] = useState(false);
      const [showRerollWarning, setShowRerollWarning] = useState(false);
      const [showDiceModifyWarning, setShowDiceModifyWarning] = useState(false);
      const [isHoveringFlipButton, setIsHoveringFlipButton] = useState(false);
      const [isRolling, setIsRolling] = useState(false);
      const [rollingDice, setRollingDice] = useState(new Set());
      
      const [showRewardSelection, setShowRewardSelection] = useState(false);
      const [rewardModalHidden, setRewardModalHidden] = useState(false);
      const [rewardOptions, setRewardOptions] = useState([]);
      const [showVictory, setShowVictory] = useState(false);
      const [showEnhancementChoice, setShowEnhancementChoice] = useState(false);
      const [enhancementOffer, setEnhancementOffer] = useState(null);
      const [currentBossType, setCurrentBossType] = useState(null);
      const [lastUsedCombination, setLastUsedCombination] = useState(null);
      const [rerollWarningMessage, setRerollWarningMessage] = useState("리롤할 주사위를 선택하세요");
      const [cursedDiceIndex, setCursedDiceIndex] = useState(null);
      const [sealedCombo, setSealedCombo] = useState(null); // combo_seal 보스용
      const [comboDecay, setComboDecay] = useState({}); // combo_decay 보스용: { 족보명: 감소량 }
      const [lastEnhancementChoice, setLastEnhancementChoice] = useState("");
      const [victoryMessages, setVictoryMessages] = useState([]);
      const [victoryMessageInput, setVictoryMessageInput] = useState("");
      const [messageSent, setMessageSent] = useState(false);
      const [hasSeenTutorial, setHasSeenTutorial] = useState(false);
      const [showTutorialMessage, setShowTutorialMessage] = useState(false);
      const [hasSeenStunTutorial, setHasSeenStunTutorial] = useState(false);
      const [showStunTutorial, setShowStunTutorial] = useState(false);
      const [gameLog, setGameLog] = useState([]); // 게임 진행 로그 누적
      const [currentStageMaxDamage, setCurrentStageMaxDamage] = useState(0); // 현재 스테이지 최고 피해량
      const [currentStageBestCombo, setCurrentStageBestCombo] = useState(''); // 현재 스테이지 최고 피해량 족보


      // 메시지 목록 가져오기 (게임 시작 시, 주기적으로)
      useEffect(() => {
        if (gameStarted) {
          fetchVictoryMessages().then(setVictoryMessages);
          const interval = setInterval(() => {
            fetchVictoryMessages().then(setVictoryMessages);
          }, 30000); // 30초마다 새로고침
          return () => clearInterval(interval);
        }
      }, [gameStarted]);

      const handleSendVictoryMessage = () => {
        if (victoryMessageInput.trim() && !messageSent) {
          sendVictoryMessage(playerId, victoryMessageInput);
          setMessageSent(true);
          // 바로 로컬에도 추가
          setVictoryMessages(prev => [{ playerId, message: victoryMessageInput.trim(), timestamp: new Date().toISOString() }, ...prev].slice(0, 20));
        }
      };

      const handleStartGame = () => {
        if (playerIdInput.trim()) {
          setPlayerId(playerIdInput.trim());
          setGameStarted(true);
        }
      };

      const totalDiceCount = playerState.diceTypes.length;
      const isBossStage = !!(currentStage?.isBoss && currentBossType);
      const bossInfo = isBossStage ? BOSS_TYPES_ALL.find(b => b.id === currentBossType) : null;
      const stunnedDiceCount = stunnedIndices.size;
      const normalDiceCount = totalDiceCount - stunnedDiceCount;
      const effectiveMaxRerolls = Math.max(0, playerState.baseRerolls - (currentBossType === 'reroll_minus1' ? 1 : 0));

      // 라운드가 시작되지 않았을 때 주사위를 순서대로 표시
      useEffect(() => {
        if (!roundStarted) {
          setCurrentDice(Array.from({ length: totalDiceCount }, (_, i) => i + 1));
          setDiceFaceIndices(Array.from({ length: totalDiceCount }, (_, i) => i));
        }
      }, [roundStarted, totalDiceCount]);

      useEffect(() => {
        const stage = STAGES[playerState.currentStage - 1];
        if (stage) {
          // 특정 보스는 체력 감소 (goToNextStage에서 이미 설정하지만 초기 로드 시에도 필요)
          let hp = stage.hp;
          if (currentBossType === 'cursed_dice') hp = 300;
          if (currentBossType === 'double_stun') hp = 500;
          if (currentBossType === 'combo_out_stun') hp = 500;
          setMonsterHp(hp);
        }
      }, [playerState.currentStage, currentBossType]);


      const currentScore = useMemo(() => {
        return calculateScore(currentDice, { 
          ownedRewards: playerState.ownedRewards,
          monsterHp: monsterHp,
          maxMonsterHp: currentStage.hp,
          diceEnhancements: playerState.diceEnhancements || [],
          combinationBoosts: playerState.combinationBoosts || {},
          usedFlipThisRound: playerState.usedFlipThisRound,
          cursedIndex: currentBossType === 'cursed_dice' ? cursedDiceIndex : null,
          rerollsLeft: rerollsLeft,
          bossType: currentBossType,
          sealedCombo: sealedCombo,
          comboDecay: comboDecay,
          lastUsedCombination: lastUsedCombination
        });
      }, [currentDice, playerState.ownedRewards, playerState.diceEnhancements, playerState.combinationBoosts, playerState.usedFlipThisRound, monsterHp, currentStage, currentBossType, cursedDiceIndex, rerollsLeft, sealedCombo, comboDecay, lastUsedCombination]);

      const toggleSelect = (index) => {
        if (!roundStarted) return;
        const hasDiceModifyStacks = (playerState.diceFlipStacks > 0);
        if (rerollsLeft === 0 && !hasDiceModifyStacks) return;
        setSelectedIndices(prev => {
          const newSet = new Set(prev);
          if (newSet.has(index)) newSet.delete(index);
          else newSet.add(index);
          return newSet;
        });
      };

      const executeCounterattack = useCallback((attackDice, usedCombination) => {
        const activeIndices = Array.from({ length: totalDiceCount }, (_, i) => i).filter(i => !stunnedIndices.has(i));
        if (activeIndices.length === 0) {
          setRoundStarted(false);
          setSelectedIndices(new Set());
          setRerollsLeft(effectiveMaxRerolls);
          return;
        }
        setShowCounterattack(true);
        setIsMonsterAttacking(true);
        setTimeout(() => {
          let indicesToStun = [];
          // 기본: 반격 시 주사위 1개 기절
          if (activeIndices.length > 0)
            indicesToStun.push(activeIndices[Math.floor(Math.random() * activeIndices.length)]);
          // combo_out_stun 추가: 족보에 포함되지 않은 주사위 중 1개 추가 기절 (이미 뽑은 것 제외)
          if (currentBossType === 'combo_out_stun' && attackDice && usedCombination) {
            const comboIndices = getComboIndices(attackDice, usedCombination, { ownedRewards: playerState.ownedRewards });
            const notInCombo = activeIndices.filter(i => !comboIndices.includes(i) && !indicesToStun.includes(i));
            if (notInCombo.length > 0)
              indicesToStun.push(notInCombo[Math.floor(Math.random() * notInCombo.length)]);
          }
          // four_extra_stun: 눈금이 4인 주사위가 있으면 추가로 1개 기절
          if (currentBossType === 'four_extra_stun' && attackDice && attackDice.some(d => d === 4)) {
            const available = activeIndices.filter(i => !indicesToStun.includes(i));
            if (available.length > 0)
              indicesToStun.push(available[Math.floor(Math.random() * available.length)]);
          }
          // five_missing_stun: 눈금이 5인 주사위가 없으면 추가로 1개 기절
          if (currentBossType === 'five_missing_stun' && attackDice && !attackDice.some(d => d === 5)) {
            const available = activeIndices.filter(i => !indicesToStun.includes(i));
            if (available.length > 0)
              indicesToStun.push(available[Math.floor(Math.random() * available.length)]);
          }
          // double_stun: 매 턴 2개 기절 (기본 1개 + 추가 1개)
          if (currentBossType === 'double_stun') {
            const available = activeIndices.filter(i => !indicesToStun.includes(i));
            if (available.length > 0)
              indicesToStun.push(available[Math.floor(Math.random() * available.length)]);
          }
          // 주사위 보호막: 기절 1회 무효
          const si = playerState.shieldIndex;
          if (si != null && !playerState.shieldUsed && indicesToStun.includes(si)) {
            indicesToStun = indicesToStun.filter(i => i !== si);
            setPlayerState(prev => ({ ...prev, shieldUsed: true }));
          }
          // 철벽 수비: 첫 번째 기절 무효화 (전투당 1회)
          if (playerState.ownedRewards.includes('stun_immunity_no_flip') && !playerState.stunImmunityUsed && indicesToStun.length > 0) {
            indicesToStun = [];
            setPlayerState(prev => ({ ...prev, stunImmunityUsed: true }));
          }
          if (indicesToStun.length > 0) {
            setBeingStunnedIndex(indicesToStun[0]);
            setTimeout(() => {
              if (currentBossType === 'abyss_curse') {
                setPlayerState(prev => {
                  const next = { ...prev, diceTypes: [...prev.diceTypes] };
                  indicesToStun.forEach(i => { next.diceTypes[i] = 'abyss_cursed'; });
                  return next;
                });
                setCurrentDice(prev => { const n = [...prev]; indicesToStun.forEach(i => n[i] = 0); return n; });
                setDiceFaceIndices(prev => { const n = [...prev]; indicesToStun.forEach(i => n[i] = 0); return n; });
              }
              setStunnedIndices(prev => new Set([...Array.from(prev), ...indicesToStun]));
              setBeingStunnedIndex(null);
              setShowCounterattack(false);
              setIsMonsterAttacking(false);
              setRoundStarted(false);
              setSelectedIndices(new Set());
              setRerollsLeft(effectiveMaxRerolls);
              // 처음 기절 발생 시 튜토리얼 표시
              if (!hasSeenStunTutorial) {
                setShowStunTutorial(true);
              }
            }, 800);
          } else {
            setShowCounterattack(false);
            setIsMonsterAttacking(false);
            setRoundStarted(false);
            setSelectedIndices(new Set());
            setRerollsLeft(effectiveMaxRerolls);
          }
        }, 500);
      }, [stunnedIndices, totalDiceCount, effectiveMaxRerolls, playerState, currentBossType]);

      const proceedToRewardSelection = useCallback(() => {
        const isDiceVariantRound = [1, 3, 5, 7].includes(playerState.currentStage);
        // 주사위 변형 라운드: 중복 허용, 3개 제시 / 룰 라운드: 중복 불가, 3개 제시
        const excludeIds = isDiceVariantRound ? [] : [...playerState.ownedRewards];
        const finalRewards = getRandomRewards(3, excludeIds, playerState.currentStage);
        setRewardOptions(finalRewards);
        setShowEnhancementChoice(false);
        setEnhancementOffer(null);
        setShowRewardSelection(true);
      }, [playerState.ownedRewards, playerState.currentStage]);

      const handleMonsterDefeated = useCallback(() => {
        if (playerState.currentStage >= STAGES.length) {
          // 마지막 스테이지 클리어 로그 추가 후 전체 게임 로그 전송 (한글 이름으로)
          const finalLog = [...gameLog, { stage: playerState.currentStage, bossType: getBossNameKo(currentBossType), rewardChoice: "" }];
          sendGameLog(playerId, finalLog, "클리어", playerState.currentStage);
          setShowVictory(true);
          triggerVictoryConfetti();
        } else {
          const nonStunnedCount = Math.max(0, playerState.diceTypes.length - stunnedIndices.size);
          // 전투 종료 보너스: 남은 주사위 수에 따라 무작위 주사위 1개 강화
          const survivalBonus = nonStunnedCount <= 2 ? 1 : nonStunnedCount <= 4 ? 2 : 3;
          
          setPlayerState(prev => {
            let n = prev;
            if (n.ownedRewards.includes('random_combo_boost')) {
              const comboKeys = Object.keys(COMBINATIONS).filter(k => k !== 'yahtzee' && k !== 'largeStraight');
              const k = comboKeys[Math.floor(Math.random() * comboKeys.length)];
              n = { ...n, combinationBoosts: { ...(n.combinationBoosts || {}), [k]: ((n.combinationBoosts || {})[k] || 0) + 1 } };
            }
            if (n.ownedRewards.includes('dice_flip_gain')) {
              n = { ...n, diceFlipStacks: Math.min((n.diceFlipStacks || 1) + 1, 99) };
            }
            // 전투 종료 보너스: 무작위 주사위 1개 강화
            if (n.diceTypes.length > 0) {
              const randomIdx = Math.floor(Math.random() * n.diceTypes.length);
              const newEnhancements = [...(n.diceEnhancements || Array(n.diceTypes.length).fill(0))];
              // 레이즈 룰: 강화 효과 2배
              const bonusMultiplier = n.ownedRewards.includes('random_die_enhance') ? 2 : 1;
              newEnhancements[randomIdx] = (newEnhancements[randomIdx] || 0) + (survivalBonus * bonusMultiplier);
              n = { ...n, diceEnhancements: newEnhancements };
            }
            return n;
          });
          // 전투 종료 보너스 정보 저장 (보상 선택 화면에서 표시)
          setEnhancementOffer({ nonStunnedCount, survivalBonus });
          // 첫 전투 클리어 시 튜토리얼 메시지 표시
          if (playerState.currentStage === 1 && !hasSeenTutorial) {
            setShowTutorialMessage(true);
          } else {
            // 바로 보상 선택으로 이동
            proceedToRewardSelection();
          }
        }
      }, [playerState.currentStage, playerState.diceTypes.length, stunnedIndices, currentBossType, proceedToRewardSelection, gameLog, playerId, hasSeenTutorial]);

      const executeAttack = useCallback((dice) => {
        setIsPlayerAttacking(true);
        const score = calculateScore(dice, { 
          ownedRewards: playerState.ownedRewards,
          monsterHp: monsterHp,
          maxMonsterHp: currentStage.hp,
          diceEnhancements: playerState.diceEnhancements || [],
          combinationBoosts: playerState.combinationBoosts || {},
          usedFlipThisRound: playerState.usedFlipThisRound,
          cursedIndex: currentBossType === 'cursed_dice' ? cursedDiceIndex : null,
          rerollsLeft: rerollsLeft,
          bossType: currentBossType,
          sealedCombo: sealedCombo,
          comboDecay: comboDecay,
          lastUsedCombination: lastUsedCombination
        });
        setAttackResult(score);
        setShowAttackResult(true);
        if (!score.isCursed) triggerConfetti(score);
        
        // combo_decay 보스: 사용한 족보 배율 -2 감소
        if (currentBossType === 'combo_decay' && score.combination) {
          setComboDecay(prev => ({
            ...prev,
            [score.combination]: (prev[score.combination] || 0) + 2
          }));
        }
        
        setTimeout(() => {
          setIsPlayerAttacking(false);
        }, 600);
        
        let actualDamage = score.total;
        // 과잉 눈금 보스: 주사위 합(강화 제외) 21 초과 시 피해 0
        if (currentBossType === 'over21_zero' && (score.sum - (score.enhancementBonus || 0)) > 21) {
          actualDamage = 0;
        } else if (currentBossType === 'damage_cap_50') {
          const cap = Math.floor(currentStage.hp * 0.5);
          actualDamage = Math.min(score.total, cap);
        }
        setLastUsedCombination(score.combination);
        const newHp = Math.max(0, monsterHp - actualDamage);
        
        // 최고 피해량 업데이트
        if (actualDamage > currentStageMaxDamage) {
          setCurrentStageMaxDamage(actualDamage);
          setCurrentStageBestCombo(`${score.label} ${score.labelKo}`);
        }
        
        setTimeout(() => {
          setLastDamage(actualDamage);
          setShowDamage(true);
          setMonsterHp(newHp);
          setTimeout(() => setShowDamage(false), 1000);
        }, 800);
        
        setTimeout(() => {
          setShowAttackResult(false);
          setAttackResult(null);
          if (newHp <= 0) {
            setRoundStarted(false);
            setSelectedIndices(new Set());
            setRerollsLeft(effectiveMaxRerolls);
            // 전투 종료: 뒤집기 스택 +1 (최대 3)
            setPlayerState(prev => ({
              ...prev,
              diceFlipStacks: Math.min((prev.diceFlipStacks || 0) + 1, 4)
            }));
            handleMonsterDefeated();
          } else {
            executeCounterattack(dice, score.combination);
          }
        }, 2000);
      }, [monsterHp, currentStage, currentBossType, lastUsedCombination, executeCounterattack, playerState.ownedRewards, effectiveMaxRerolls, handleMonsterDefeated, stunnedIndices, cursedDiceIndex]);

      const rollCustomDice = useCallback(() => {
        const hasStunnedHold = playerState.ownedRewards.includes('stunned_hold');
        const newDice = [];
        const newFaceIndices = [];
        playerState.diceTypes.forEach((type, idx) => {
          const isStunned = stunnedIndices.has(idx);
          const isSelected = selectedIndices.has(idx);
          // 리롤 시스템: 선택된 주사위가 리롤됨
          // 기절 주사위: 기본적으로 항상 리롤됨 (stunned_hold 룰이 있으면 자동 리롤 안됨, 단 선택하면 리롤)
          const stunnedAutoHeld = isStunned && hasStunnedHold && !isSelected;
          const shouldReroll = isStunned ? (hasStunnedHold ? isSelected : true) : isSelected;
          if (shouldReroll) {
            const { value, faceIndex } = rollDieWithIndex(type, isStunned);
            newDice.push(value);
            newFaceIndices.push(faceIndex);
          } else {
            newDice.push(currentDice[idx]);
            newFaceIndices.push(diceFaceIndices[idx] ?? 0);
          }
        });
        return { newDice, newFaceIndices };
      }, [playerState.diceTypes, playerState.ownedRewards, selectedIndices, stunnedIndices, currentDice, diceFaceIndices]);

      const handleInitialRoll = () => {
        // 이월된 리롤 포함하여 설정 후 이월 리롤 초기화
        const carryOver = playerState.carryOverRerolls || 0;
        setPlayerState(prev => ({ ...prev, usedFlipThisRound: false, carryOverRerolls: 0 }));
        setSelectedIndices(new Set());
        setRerollsLeft(effectiveMaxRerolls + carryOver);
        if (currentBossType === 'cursed_dice' && totalDiceCount > 0 && cursedDiceIndex === null)
          setCursedDiceIndex(Math.floor(Math.random() * totalDiceCount));
        // combo_seal 보스: 매 턴 무작위 족보 1개 봉인 (chance 제외)
        if (currentBossType === 'combo_seal') {
          const sealableCombos = ['yahtzee', 'largeStraight', 'fourOfAKind', 'fullHouse', 'smallStraight', 'twoPair', 'threeOfAKind'];
          setSealedCombo(sealableCombos[Math.floor(Math.random() * sealableCombos.length)]);
        } else {
          setSealedCombo(null);
        }
        setRoundStarted(true);
        setShowAttackResult(false);
        setAttackResult(null);
        
        // 모든 주사위를 굴리는 중으로 설정
        setIsRolling(true);
        setRollingDice(new Set(Array.from({ length: totalDiceCount }, (_, i) => i)));
        
        // 애니메이션 후 주사위 값 업데이트
        setTimeout(() => {
          const newDice = [];
          const newFaceIndices = [];
          playerState.diceTypes.forEach((type, idx) => {
            const isStunned = stunnedIndices.has(idx);
            const { value, faceIndex } = rollDieWithIndex(type, isStunned);
            newDice.push(value);
            newFaceIndices.push(faceIndex);
          });
          setCurrentDice(newDice);
          setDiceFaceIndices(newFaceIndices);
          setIsRolling(false);
          setRollingDice(new Set());
        }, 600);
      };

      const handleReroll = () => {
        if (rerollsLeft <= 0) return;
        const hasStunnedHold = playerState.ownedRewards.includes('stunned_hold');

        // 리롤 시스템: 선택된 주사위 + 기절한 주사위(홀드되지 않은)가 리롤됨
        const diceToRoll = new Set();
        playerState.diceTypes.forEach((type, idx) => {
          const isStunned = stunnedIndices.has(idx);
          const isSelected = selectedIndices.has(idx);
          // 기절 주사위: 기본적으로 항상 리롤됨 (stunned_hold 룰이 있으면 자동 리롤 안됨, 단 선택하면 리롤)
          const shouldReroll = isStunned ? (hasStunnedHold ? isSelected : true) : isSelected;
          if (shouldReroll) {
            diceToRoll.add(idx);
          }
        });

        // 리롤 2개 제한 보스: 선택한 주사위만 카운트 (기절 주사위 제외)
        const selectedNonStunned = Array.from(selectedIndices).filter(idx => !stunnedIndices.has(idx)).length;
        if (currentBossType === 'reroll_max2' && selectedNonStunned > 2) {
          setRerollWarningMessage("3개 이상 동시 리롤 불가 (2개 이하만 선택하세요)");
          setShowRerollWarning(true);
          setTimeout(() => setShowRerollWarning(false), 2000);
          return;
        }

        // 기절 주사위 외에 선택된 주사위가 없으면 경고
        if (selectedNonStunned === 0 && !Array.from(diceToRoll).some(idx => stunnedIndices.has(idx))) {
          setRerollWarningMessage("리롤할 주사위를 선택하세요");
          setShowRerollWarning(true);
          setTimeout(() => setShowRerollWarning(false), 2000);
          return;
        }
        
        setIsRolling(true);
        setRollingDice(diceToRoll);
        
        // 애니메이션 후 주사위 값 업데이트
        setTimeout(() => {
          let { newDice, newFaceIndices } = rollCustomDice();
          setCurrentDice(newDice);
          setDiceFaceIndices(newFaceIndices);
          setSelectedIndices(new Set()); // 리롤 후 선택 해제
          setRerollsLeft(prev => prev - 1);
          if (currentBossType === 'despair_heal') {
            setMonsterHp(prev => Math.min(currentStage.hp, prev + Math.ceil(currentStage.hp * 0.1)));
          }
          if (playerState.ownedRewards.includes('reroll_burn')) {
            const burnSum = Array.from(diceToRoll).reduce((s, i) => s + (newDice[i] || 0) + ((playerState.diceEnhancements || [])[i] || 0), 0);
            setMonsterHp(prev => Math.max(0, prev - burnSum));
          }
          setIsRolling(false);
          setRollingDice(new Set());
        }, 600);
      };

      const goToNextStage = (stateAfterReward, rewardChoice) => {
        // 스테이지 클리어 로그 누적 (한글 이름으로 저장)
        setGameLog(prev => [...prev, {
          stage: stateAfterReward.currentStage,
          bossType: getBossNameKo(currentBossType),
          rewardChoice: getRewardNameKo(rewardChoice),
          maxDamage: currentStageMaxDamage,
          bestCombo: currentStageBestCombo
        }]);
        // 다음 스테이지를 위해 초기화
        setCurrentStageMaxDamage(0);
        setCurrentStageBestCombo('');
        setLastEnhancementChoice("");
        const newState = { ...stateAfterReward };
        newState.currentStage += 1;
        if (newState.shieldIndex != null) newState.shieldUsed = false;
        // 철벽 수비: 다음 전투에서 다시 사용 가능
        newState.stunImmunityUsed = false;
        // 리롤 이월 룰: 남은 리롤을 다음 전투로 이월
        if (newState.ownedRewards.includes('reroll_carryover')) {
          newState.carryOverRerolls = (newState.carryOverRerolls || 0) + rerollsLeft;
        } else {
          newState.carryOverRerolls = 0;
        }
        // 심연의 저주 보스로 변환된 주사위를 normal로 복구
        if (currentBossType === 'abyss_curse') {
          newState.diceTypes = newState.diceTypes.map(t => t === 'abyss_cursed' ? 'normal' : t);
        }
        const newDiceCount = newState.diceTypes.length;
        const cur = newState.diceEnhancements || [];
        if (cur.length !== newDiceCount) {
          newState.diceEnhancements = newDiceCount > cur.length
            ? [...cur, ...Array(newDiceCount - cur.length).fill(0)]
            : cur.slice(0, newDiceCount);
        }
        setPlayerState(newState);
        setShowRewardSelection(false);
        setRewardModalHidden(false);
        setStunnedIndices(new Set());
        setCurrentDice(Array.from({ length: newDiceCount }, (_, i) => i + 1));
        setDiceFaceIndices(Array.from({ length: newDiceCount }, (_, i) => i));
        const nextStage = STAGES[newState.currentStage - 1];
        let nextBossId = null;
        if (newState.currentStage === 2) {
          const pool = BOSS_TYPES_STAGE_2;
          nextBossId = pool[Math.floor(Math.random() * pool.length)].id;
        } else if (newState.currentStage === 4) {
          const pool = BOSS_TYPES_STAGE_4;
          nextBossId = pool[Math.floor(Math.random() * pool.length)].id;
        } else if (newState.currentStage === 6) {
          const pool = BOSS_TYPES_STAGE_6;
          nextBossId = pool[Math.floor(Math.random() * pool.length)].id;
        } else if (newState.currentStage === 8) {
          const pool = BOSS_TYPES_STAGE_8;
          nextBossId = pool[Math.floor(Math.random() * pool.length)].id;
        }
        // 보스 체력 설정 (특정 보스는 체력 감소)
        if (nextStage) {
          let bossHp = nextStage.hp;
          if (nextBossId === 'cursed_dice') bossHp = 300; // 4라운드 저주 주사위 보스: 400 → 300
          if (nextBossId === 'double_stun') bossHp = 500; // 6라운드 이중 기절 보스: 600 → 500
          if (nextBossId === 'combo_out_stun') bossHp = 500; // 6라운드 미포함 기절 보스: 600 → 500
          setMonsterHp(bossHp);
        }
        setCurrentBossType(nextBossId);
        // 이월된 리롤 포함하여 설정
        const baseRerolls = Math.max(0, newState.baseRerolls - (nextBossId === 'reroll_minus1' ? 1 : 0));
        setRerollsLeft(baseRerolls + (newState.carryOverRerolls || 0));
        setLastUsedCombination(null);
        setCursedDiceIndex(null);
        setComboDecay({}); // combo_decay 보스 초기화
      };

      const handleSelectReward = (reward) => {
        // 주사위 변형 보상은 중복 허용
        const isDiceVariant = /^dice_\d/.test(reward.id);
        if (!isDiceVariant && playerState.ownedRewards.includes(reward.id)) return;
        const stateAfterReward = applyReward(playerState, reward.id);
        goToNextStage(stateAfterReward, reward.id);
      };

      const handleRestart = () => {
        const initialState = getInitialPlayerState();
        setPlayerState(initialState);
        const initialDiceCount = initialState.diceTypes.length;
        setCurrentDice(Array.from({ length: initialDiceCount }, (_, i) => i + 1));
        setDiceFaceIndices(Array.from({ length: initialDiceCount }, (_, i) => i));
        setSelectedIndices(new Set());
        setRerollsLeft(initialState.baseRerolls);
        setRoundStarted(false);
        setStunnedIndices(new Set());
        setMonsterHp(STAGES[0].hp);
        setShowVictory(false);
        setShowRewardSelection(false);
        setRewardModalHidden(false);
        setShowEnhancementChoice(false);
        setEnhancementOffer(null);
        setShowTutorialMessage(false);
        setShowStunTutorial(false);
        setCurrentBossType(null);
        setLastUsedCombination(null);
        setCursedDiceIndex(null);
        setVictoryMessageInput("");
        setMessageSent(false);
        setGameLog([]); // 게임 로그 초기화
        setCurrentStageMaxDamage(0); // 최고 피해량 초기화
        setCurrentStageBestCombo(''); // 최고 족보 초기화
      };

      const canReroll = roundStarted && rerollsLeft > 0 && !showAttackResult && !showCounterattack;
      const canAttack = roundStarted && !showAttackResult && !showCounterattack;
      const isMonsterDefeated = monsterHp <= 0;
      const allDiceStunned = normalDiceCount <= 0;

      if (!gameStarted) {
        return (
          <div className="container" style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', minHeight: '100vh' }}>
            <div className="main-game" style={{ maxWidth: '500px', textAlign: 'center', padding: '3rem' }}>
              <div className="bg-decoration bg-1" />
              <div className="bg-decoration bg-2" />
              <h1 style={{ fontSize: '2.5rem', fontWeight: 'bold', marginBottom: '1rem', color: '#1e293b' }}>🎲 House Rule</h1>
              <p style={{ fontSize: '1rem', color: '#64748b', marginBottom: '2rem' }}>주사위 전투 게임에 오신 것을 환영합니다!</p>
              <div style={{ marginBottom: '1.5rem' }}>
                <label style={{ display: 'block', fontSize: '0.875rem', fontWeight: 'bold', color: '#374151', marginBottom: '0.5rem', textAlign: 'left' }}>
                  플레이어 ID를 입력하세요
                </label>
                <input
                  type="text"
                  value={playerIdInput}
                  onChange={(e) => setPlayerIdInput(e.target.value)}
                  onKeyPress={(e) => e.key === 'Enter' && handleStartGame()}
                  placeholder="예: Player123"
                  style={{
                    width: '100%',
                    padding: '0.875rem 1rem',
                    fontSize: '1rem',
                    border: '2px solid #e2e8f0',
                    borderRadius: '0.75rem',
                    outline: 'none',
                    transition: 'border-color 0.2s',
                  }}
                  onFocus={(e) => e.target.style.borderColor = '#6366f1'}
                  onBlur={(e) => e.target.style.borderColor = '#e2e8f0'}
                />
              </div>
              <button
                className="btn btn-attack"
                onClick={handleStartGame}
                disabled={!playerIdInput.trim()}
                style={{
                  width: '100%',
                  padding: '1rem',
                  fontSize: '1.125rem',
                  opacity: playerIdInput.trim() ? 1 : 0.5,
                  cursor: playerIdInput.trim() ? 'pointer' : 'not-allowed'
                }}
              >
                게임 시작
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="container">
          <main className="main-game">
            <div className="bg-decoration bg-1" />
            <div className="bg-decoration bg-2" />
            
            <div className="stage-indicator">
              <span style={{ 
                background: 'linear-gradient(135deg, #10b981, #059669)', 
                color: 'white', 
                padding: '0.25rem 0.75rem', 
                borderRadius: '9999px', 
                fontSize: '0.75rem', 
                fontWeight: 'bold' 
              }}>
                👤 {playerId}
              </span>
              <span className="stage-badge">Stage {playerState.currentStage} / 8{currentStage?.isBoss ? ' (보스)' : ''}</span>
              {playerState.diceFlipStacks > 0 && (
                <div style={{
                  background: 'linear-gradient(135deg, #8b5cf6, #7c3aed)',
                  color: 'white',
                  padding: '0.25rem 0.75rem',
                  borderRadius: '9999px',
                  fontSize: '0.875rem',
                  fontWeight: 'bold',
                  display: 'flex',
                  alignItems: 'center',
                  gap: '0.25rem',
                  marginLeft: '0.5rem'
                }}>
                  <span>🔄</span>
                  <span>{playerState.diceFlipStacks}/4</span>
                </div>
              )}
              <button 
                className="btn" 
                onClick={() => {
                  if (window.confirm('정말 포기하시겠습니까? 처음부터 다시 시작합니다.')) {
                    // 포기한 스테이지의 보스 정보도 포함
                    const finalLog = [...gameLog, { stage: playerState.currentStage, bossType: getBossNameKo(currentBossType), rewardChoice: "(포기)" }];
                    sendGameLog(playerId, finalLog, "포기", playerState.currentStage);
                    handleRestart();
                  }
                }}
                style={{ 
                  marginLeft: '0.5rem', 
                  padding: '0.5rem 1rem', 
                  fontSize: '0.875rem',
                  background: 'rgba(239, 68, 68, 0.15)',
                  border: '1px solid rgba(239, 68, 68, 0.4)',
                  color: '#ef4444'
                }}
              >
                포기
              </button>
            </div>

            {bossInfo && (
              <div style={{
                marginBottom: '1rem',
                padding: '0.75rem 1rem',
                background: 'linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(99, 102, 241, 0.15))',
                border: '1px solid rgba(139, 92, 246, 0.4)',
                borderRadius: '0.75rem',
                fontSize: '0.875rem'
              }}>
                <div style={{ fontWeight: 'bold', marginBottom: '0.25rem', color: '#a78bfa' }}>👹 보스 룰: {bossInfo.descriptionKo}</div>
                {currentBossType === 'pattern_limit' && lastUsedCombination && (
                  <div style={{ marginTop: '0.5rem', padding: '0.5rem', background: 'rgba(239, 68, 68, 0.2)', borderRadius: '0.5rem', color: '#ef4444', fontWeight: 'bold' }}>
                    ⚠️ 사용 불가: {COMBINATIONS[lastUsedCombination]?.labelKo || lastUsedCombination}
                  </div>
                )}
              </div>
            )}
            
            <div className="monster-section">
              <Monster name={currentStage.name} nameKo={bossInfo?.monsterNameKo || currentStage.nameKo} maxHp={currentBossType === 'cursed_dice' ? 300 : currentBossType === 'double_stun' ? 500 : currentBossType === 'combo_out_stun' ? 500 : currentStage.hp} currentHp={monsterHp} showDamage={showDamage} damage={lastDamage} isMonsterAttacking={isMonsterAttacking} imageUrl={bossInfo?.imageUrl || currentStage.imageUrl} previewDamage={roundStarted && !showAttackResult && !showCounterattack && !allDiceStunned ? (currentBossType === 'over21_zero' && (currentScore.sum - (currentScore.enhancementBonus || 0)) > 21 ? 0 : currentBossType === 'damage_cap_50' ? Math.min(currentScore.total, Math.floor(currentStage.hp * 0.5)) : currentScore.total) : 0} />
            </div>

            {showTutorialMessage && (
              <div className="modal-overlay">
                <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: '400px', textAlign: 'center' }}>
                  <h2 style={{ fontSize: '1.5rem', fontWeight: 'bold', marginBottom: '1rem' }}>💡 팁!</h2>
                  <p style={{ marginBottom: '1.5rem', fontSize: '1rem', lineHeight: '1.6' }}>
                    남은 주사위 갯수에 따라<br/>무작위 주사위가 강화됩니다.
                  </p>
                  <button 
                    className="btn btn-attack" 
                    onClick={() => {
                      setShowTutorialMessage(false);
                      setHasSeenTutorial(true);
                      proceedToRewardSelection();
                    }}
                    style={{ padding: '0.75rem 2rem', fontSize: '1rem' }}
                  >
                    확인
                  </button>
                </div>
              </div>
            )}

            {showStunTutorial && (
              <div className="modal-overlay">
                <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: '420px', textAlign: 'center' }}>
                  <h2 style={{ fontSize: '1.5rem', fontWeight: 'bold', marginBottom: '1rem' }}>💫 기절!</h2>
                  <p style={{ marginBottom: '1rem', fontSize: '1rem', lineHeight: '1.8' }}>
                    몬스터가 반격시 무작위 주사위가 기절합니다.
                  </p>
                  <p style={{ marginBottom: '1.5rem', fontSize: '1rem', lineHeight: '1.8' }}>
                    기절한 주사위는 <span style={{ color: '#ef4444', fontWeight: 'bold' }}>[1, 0]</span> 눈금을 가지고 있고<br/>
                    <span style={{ fontWeight: 'bold' }}>자동으로 리롤</span>됩니다.
                  </p>
                  <button 
                    className="btn btn-attack" 
                    onClick={() => {
                      setShowStunTutorial(false);
                      setHasSeenStunTutorial(true);
                    }}
                    style={{ padding: '0.75rem 2rem', fontSize: '1rem' }}
                  >
                    확인
                  </button>
                </div>
              </div>
            )}

            {showVictory && (
              <div className="modal-overlay">
                <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: '800px', maxHeight: '90vh', overflowY: 'auto' }}>
                  <h2 style={{ fontSize: '2rem', fontWeight: 'bold', marginBottom: '0.5rem', textAlign: 'center' }}>🎉 클리어! 🎉</h2>
                  <p style={{ marginBottom: '2rem', textAlign: 'center', color: 'rgba(255,255,255,0.8)' }}>모든 스테이지를 완료했습니다!</p>
                  
                  <div style={{ marginBottom: '2rem' }}>
                    <h3 style={{ fontSize: '1.25rem', fontWeight: 'bold', marginBottom: '1rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                      📊 최종 빌드

                // combinationBoosts (무작위 족보 강화 등)
                const comboBoost = (playerState.combinationBoosts || {})[key] || 0;
                // 룰로 인한 고정 배율 증가
                let passiveBoost = 0;
                if (key === 'fullHouse' && playerState.ownedRewards.includes('fullhouse_boost')) passiveBoost = 3;
                if (key === 'smallStraight' && playerState.ownedRewards.includes('small_straight_boost')) passiveBoost = 3;
                if (key === 'twoPair' && playerState.ownedRewards.includes('two_pair_boost')) passiveBoost = 2;
                if (key === 'threeOfAKind' && playerState.ownedRewards.includes('triple_boost')) passiveBoost = 2;
                const totalBoost = comboBoost + passiveBoost;
                const decay = (comboDecay || {})[key] || 0;
                const mult = Math.max(1, combo.multiplier + totalBoost - decay);
                const hasBoost = totalBoost > 0;
                const hasDecay = decay > 0;
                let color = 'inherit';
                if (hasDecay) color = '#ef4444';
                else if (hasBoost) color = '#fbbf24';
                return (
                  <div key={key} className="guide-item">
                    <span>{combo.labelKo}</span>
                    <span style={{ fontWeight: 'bold', color }}>
                      ×{mult}
                      {hasBoost && !hasDecay && ` (+${totalBoost})`}
                      {hasDecay && ` ⬇-${decay}`}
                    </span>
                  </div>
                );
              })}
            </div>

            {victoryMessages.length > 0 && (
              <div className="guide-card" style={{ marginTop: '1rem' }}>
                <h2 style={{ fontSize: '1.25rem', fontWeight: 'bold', marginBottom: '0.75rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                  🏆 클리어 메시지
                </h2>
                <div style={{ maxHeight: '200px', overflowY: 'auto' }}>
                  {victoryMessages.slice(0, 10).map((msg, idx) => (
                    <div key={idx} style={{
                      padding: '0.5rem',
                      marginBottom: '0.5rem',
                      background: 'rgba(255,255,255,0.05)',
                      borderRadius: '0.5rem',
                      fontSize: '0.8rem'
                    }}>
                      <div style={{ fontWeight: 'bold', color: '#10b981', marginBottom: '0.25rem' }}>
                        {msg.playerId}
                      </div>
                      <div style={{ color: 'rgba(255,255,255,0.9)' }}>
                        {msg.message}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </aside>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Game />);
  </script>
</body>
</html>
